name: Linux build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: launcher/package-lock.json
      - name: Install launcher dependencies
        working-directory: launcher
        run: npm ci
      - name: Test launcher
        working-directory: launcher
        run: npm test
      - name: Build LUCID client and Linux packages
        working-directory: launcher
        env:
          SNOWBALL_SKIP_GAMETEST: '1'
        run: npm run dist:linux
      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: lucid-linux-preview
          path: |
            launcher/release/LUCID-*-linux-*.AppImage
            launcher/release/LUCID-*-linux-*.deb
          if-no-files-found: error
